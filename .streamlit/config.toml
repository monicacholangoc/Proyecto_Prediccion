# .streamlit/config.toml
# IMPORTANTE: backgroundColor debe ser transparente/vacío para que nuestro
# CSS de styles.css controle el fondo. Si se pone un color aquí,
# Streamlit lo inyecta con !important y sobreescribe nuestro gradiente.

[theme]
primaryColor             = "#1746a2"
backgroundColor          = ""
secondaryBackgroundColor = ""
textColor                = "#0f172a"
font                     = "sans serif"

[server]
maxUploadSize  = 500
maxMessageSize = 500

[client]
showSidebarNavigation = false