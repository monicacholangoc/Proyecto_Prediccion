[theme]
# Tema base CLARO — el modo oscuro/sistema lo maneja el JS de shared_sidebar.py
# No pongas backgroundColor oscuro aquí; Streamlit lo inyecta como inline style
# y pisa cualquier CSS, imposibilitando el cambio dinámico.
primaryColor       = "#1746a2"
backgroundColor    = "#edf2f8"
secondaryBackgroundColor = "#ffffff"
textColor          = "#0f172a"
font               = "sans serif"

[server]
maxUploadSize  = 500
maxMessageSize = 500

[client]
# Oculta la navegación automática de Streamlit (usamos la del sidebar custom)
showSidebarNavigation = false