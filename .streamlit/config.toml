# .streamlit/config.toml
# UBICACIÓN: carpeta .streamlit/ en la raíz del repositorio

[theme]
# El selector de tema nativo (☀ / ◑) aparece junto al botón Share
# cuando toolbarMode = "auto". NO pongas backgroundColor aquí.
primaryColor             = "#1746a2"
backgroundColor          = ""
secondaryBackgroundColor = ""
textColor                = "#0f172a"
font                     = "sans serif"

[server]
maxUploadSize  = 500
maxMessageSize = 500

[client]
showSidebarNavigation = false
toolbarMode           = "auto"